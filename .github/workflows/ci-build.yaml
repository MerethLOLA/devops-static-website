name: CI Docker Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest  # ✅ moved here, or keep as self-hosted if intended

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}   # ✅ fixed secret names
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: semereth/devops-static-website:latest
        cache-from: type=gha        # ✅ added layer caching
        cache-to: type=gha,mode=max

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.28.0   # ✅ updated version
      with:
        image-ref: semereth/devops-static-website:latest  # ✅ matches pushed tag
        format: table
        severity: CRITICAL,HIGH,MEDIUM
        exit-code: 1
        vuln-type: os,library
        ignore-unfixed: true