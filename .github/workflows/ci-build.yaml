name: CI Docker Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.username }}
        password: ${{ secrets.password }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: semereth/devops-static-website:latest
        runs-on: self-hosted
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.20.0
      with:
        image-ref: semereth/devops-static-website:v1
        format: table
        severity: CRITICAL,HIGH,MEDIUM
        exit-code: 1
        vuln-type: os,library
        ignore-unfixed: true

# Job 2 : Scan Trivy sur Ubuntu (GitHub hébergé)
  trivy:
    runs-on: ubuntu-latest
    needs: build  # attend que build soit terminé

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/devops-static-website:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          vuln-type: os,library
          ignore-unfixed: true